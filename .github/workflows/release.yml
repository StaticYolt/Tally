# Builds the desktop app on Windows, macOS and Linux whenever you push a version tag
# (for example v1.0.1), then attaches the installers to a GitHub Release.
# The website's download buttons always point at the newest release.
name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          # No signing certificate yet, so tell electron-builder not to look for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: tally-${{ matrix.os }}
          path: |
            dist/Tally-Windows-Setup.exe
            dist/Tally-macOS.dmg
            dist/Tally-Linux.AppImage
            dist/Tally-Linux.deb
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tally ${GITHUB_REF_NAME#v}" \
            --generate-notes
